<!-- index.html -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ألعاب العائلة Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --app-height: 100vh; --font-title: clamp(1.4rem, 5vw, 2.5rem); }
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; background-color: #0f172a; }
        body { font-family: 'Tajawal', sans-serif; color: #f8fafc; padding: env(safe-area-inset-top, 24px) env(safe-area-inset-right, 15px) env(safe-area-inset-bottom, 20px) env(safe-area-inset-left, 15px); display: flex; flex-direction: column; }
        #app { flex: 1; display: flex; flex-direction: column; width: 100%; max-width: 800px; margin: 0 auto; }
        .bg-slate-card { background-color: #1e293b; }
        .btn-teal { background-color: #14b8a6; }
        .btn-purple { background-color: #a855f7; }
        .hidden { display: none !important; }
        .input-error { color: #f87171; font-size: 0.9rem; margin-top: 0.5rem; font-weight: bold; }
        .shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-4px, 0, 0); } 40%, 60% { transform: translate3d(4px, 0, 0); } }
        .progress-badge { background: #334155; padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; color: #94a3b8; }
        .timer-display { font-size: 1.2rem; font-weight: 900; color: #14b8a6; min-width: 80px; text-align: center; }
        .timer-display.urgent { color: #ef4444; animation: pulse 1s infinite; }
        .feedback-correct { background: linear-gradient(135deg, #065f46 0%, #047857 100%); border: 3px solid #34d399; box-shadow: 0 10px 30px rgba(52, 211, 153, 0.3); }
        .feedback-wrong { background: linear-gradient(135deg, #7f1d1d 0%, #991b1b 100%); border: 3px solid #f87171; box-shadow: 0 10px 30px rgba(248, 113, 113, 0.3); }
        #digit-boxes { display: flex; flex-direction: row-reverse; justify-content: center; gap: 8px; }
        .digit-box { width: clamp(50px, 15vw, 80px); height: clamp(50px, 15vw, 80px); border: 2px solid #475569; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; font-weight: 900; background: #1e293b; direction: ltr; }
        .keypad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; max-width: 450px; margin: 0 auto; direction: ltr; }
        .key-btn { height: clamp(50px, 10vh, 70px); display: flex; align-items: center; justify-content: center; background: #334155; border-radius: 12px; font-size: 1.4rem; font-weight: bold; border: none; }
        .key-btn.disabled { opacity: 0.1; pointer-events: none; }
        .score-row { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #334155; font-size: 1.2rem; }
        .hand-container { position: relative; width: clamp(180px, 40vw, 400px); height: clamp(100px, 20vw, 250px); margin: 10px auto; perspective: 1000px; }
        .hand { position: absolute; width: 50%; height: 100%; background: #fbbf24; border: 3px solid #b45309; transition: transform 0.6s ease-in-out; z-index: 10; }
        .hand-left { left: 0; transform-origin: left; border-radius: 15px 0 0 15px; }
        .hand-right { right: 0; transform-origin: right; border-radius: 0 15px 15px 0; }
        .open .hand-left { transform: rotateY(-110deg); }
        .open .hand-right { transform: rotateY(110deg); }
        .number-reveal { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: clamp(2.5rem, 10vw, 6rem); font-weight: 800; color: #fff; z-index: 5; opacity: 0; transition: opacity 0.2s; direction: ltr; }
        .open .number-reveal { opacity: 1; }
        #host-timer-text { font-size: 1.5rem; font-weight: 900; }
        #answer-counter { font-size: 1rem; font-weight: bold; color: #14b8a6; }
        #qr-modal { backdrop-filter: blur(5px); }
        #player-result-modal { backdrop-filter: blur(10px); }
        .result-digit-box { width: 50px; height: 50px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 900; margin: 0 4px; }
        .result-correct { background: #065f46; color: #34d399; border: 2px solid #34d399; }
        .result-wrong { background: #7f1d1d; color: #f87171; border: 2px solid #f87171; text-decoration: line-through; }
        /* Hangman host (phone): keep controls above the fold */
        .host-game--hangman {
            justify-content: flex-start !important;
            overflow: hidden;
            padding-top: 0.35rem;
            padding-bottom: 0.35rem;
        }
        .hangman-host-scroll {
            flex: 1 1 0;
            min-height: 0;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .hangman-host-controls { padding-top: 0.35rem !important; padding-bottom: 0.35rem !important; }
        .hangman-host-leaderboard { max-height: 10vh !important; padding-top: 0.35rem !important; padding-bottom: 0.35rem !important; }
    </style>
</head>
<body>
    <div id="app">
        <header class="flex justify-between items-center py-2 shrink-0">
            <button type="button" onclick="goHome()" id="global-home-btn" class="hidden text-white bg-slate-800 p-3 rounded-full"><i class="fa-solid fa-house"></i></button>
            <h1 class="font-black text-teal-400 mx-auto" style="font-size: var(--font-title);">ألعاب العائلة</h1>
            <button onclick="backToGameMenu()" id="host-back-btn" class="hidden text-white bg-red-900 p-3 rounded-full"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
        </header>
        <main class="flex-1 flex flex-col justify-center overflow-hidden">
            <div id="setup-screen" class="space-y-6 w-full px-4">
                <div class="bg-slate-card p-6 rounded-[2rem] shadow-2xl border border-slate-700">
                    <input id="player-name-input" type="text" placeholder="اسمك الكريم..." class="w-full p-4 rounded-xl bg-slate-800 text-center text-white mb-2 border border-slate-600 outline-none text-xl font-bold transition-all">
                    <div id="name-error" class="input-error hidden text-center"></div>
                    <button onclick="setRole('player')" class="w-full btn-teal text-white p-5 rounded-xl text-2xl font-black mt-4">دخول</button>
                </div>
                <button onclick="showHostAuth()" class="w-full text-slate-500 text-sm underline">لوحة التحكم</button>
            </div>
            <div id="host-auth" class="hidden fixed inset-0 bg-black/95 flex items-center justify-center p-6 z-50">
                <div class="bg-slate-900 p-8 rounded-3xl border border-slate-700 w-full max-w-sm text-center">
                    <div id="host-pin-step">
                        <input id="host-pin" type="password" placeholder="****" class="w-full p-4 rounded-xl bg-slate-800 text-center text-white mb-4 text-3xl outline-none border border-teal-500">
                        <button onclick="verifyHost()" class="w-full p-4 btn-purple rounded-xl font-black">تأكيد</button>
                    </div>
                    <div id="host-session-choice" class="hidden space-y-3 mt-2">
                        <p class="text-slate-400 text-sm mb-1">اختر كيف تريد الدخول إلى لوحة التحكم</p>
                        <button type="button" onclick="hostStartNewSession()" class="w-full p-4 bg-rose-800 rounded-xl font-black">جلسة جديدة</button>
                        <button type="button" onclick="hostContinueSession()" class="w-full p-4 bg-slate-700 rounded-xl font-black">متابعة الجلسة السابقة</button>
                    </div>
                </div>
            </div>
            <div id="section-select" class="hidden space-y-4 px-4 w-full">
                <button onclick="chooseSection('adults')" class="w-full p-6 bg-slate-700 rounded-[1.5rem] font-black text-xl">قسم الكبار <i class="fa-solid fa-user-tie mr-2"></i></button>
                <button onclick="chooseSection('children')" class="w-full p-6 bg-pink-900 rounded-[1.5rem] font-black text-xl">قسم الأطفال <i class="fa-solid fa-child-reaching mr-2"></i></button>
                <button onclick="toggleScoreboardOnly()" class="w-full p-6 bg-amber-600 rounded-[1.5rem] font-black text-xl">جدول النقاط <i class="fa-solid fa-trophy mr-2"></i></button>
                <button onclick="showJoinQR()" class="w-full p-6 bg-blue-600 rounded-[1.5rem] font-black text-xl">انضمام اللاعبين <i class="fa-solid fa-qrcode mr-2"></i></button>
            </div>
            <div id="qr-modal" class="hidden fixed inset-0 bg-black/95 flex items-center justify-center p-6 z-[100]">
                <div class="bg-slate-900 p-8 rounded-3xl border-2 border-teal-500 max-w-sm w-full text-center relative shadow-2xl">
                    <button onclick="dismissQR()" class="absolute top-4 left-4 text-slate-400 hover:text-white text-3xl p-2 transition-colors"><i class="fa-solid fa-xmark"></i></button>
                    <h3 class="text-2xl font-bold text-teal-400 mb-6">انضم للعبة</h3>
                    <div class="bg-white p-4 rounded-xl inline-block mb-4 shadow-lg"><div id="qrcode-container"></div></div>
                    <p class="text-slate-300 text-lg mb-2">امسح الكود للانضمام</p>
                    <p class="text-slate-500 text-sm" id="qr-url-display"></p>
                </div>
            </div>
            <div id="hangman-feedback-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-6 z-[110] pointer-events-auto">
                <div id="hangman-feedback-inner" class="bg-slate-900 border-2 border-teal-500 rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl opacity-0 transition-opacity duration-300">
                    <div id="hangman-feedback-icon" class="text-6xl mb-3"></div>
                    <p id="hangman-feedback-text" class="text-2xl font-black text-white"></p>
                </div>
            </div>
            <div id="player-result-modal" class="hidden fixed inset-0 bg-black/95 flex items-center justify-center p-6 z-[100]">
                <div class="bg-slate-900 p-6 rounded-3xl border-2 border-teal-500 max-w-sm w-full text-center shadow-2xl">
                    <h3 class="text-2xl font-bold text-teal-400 mb-4">النتيجة</h3>
                    <div class="mb-4">
                        <p class="text-slate-400 mb-2">الرقم الصحيح:</p>
                        <div id="result-correct-number" class="flex justify-center flex-row-reverse mb-4"></div>
                    </div>
                    <div class="mb-4">
                        <p class="text-slate-400 mb-2">إجابتك:</p>
                        <div id="result-player-number" class="flex justify-center flex-row-reverse mb-4"></div>
                    </div>
                    <div id="result-points" class="text-3xl font-black text-yellow-400 mb-4"></div>
                    <button onclick="closePlayerResult()" class="w-full p-4 bg-teal-600 rounded-xl font-bold text-lg">استمر</button>
                </div>
            </div>
            <div id="type-select" class="hidden scroll-container px-4 w-full">
                <div class="bg-slate-800 p-4 rounded-xl flex justify-between items-center border border-slate-700 mb-4">
                    <span class="font-bold">المؤقت</span>
                    <input type="checkbox" id="timer-enabled" class="w-7 h-7 accent-teal-500" checked>
                </div>
                <div id="brain-sub-menu" class="space-y-3"></div>
                <button onclick="setupTwisters()" class="w-full p-6 mt-3 bg-orange-600 rounded-[1.5rem] font-black text-xl">تلاعب لفظي <i class="fa-solid fa-tongue mr-2"></i></button>
                <button onclick="setupHangman()" class="w-full p-6 mt-3 bg-emerald-700 rounded-[1.5rem] font-black text-xl">المشنقة <i class="fa-solid fa-font ml-2"></i></button>
            </div>
            <div id="memory-difficulty" class="hidden space-y-4 px-4 w-full">
                <button onclick="startMemory('easy')" class="w-full p-5 bg-green-700 rounded-xl font-bold">سهل</button>
                <button onclick="startMemory('medium')" class="w-full p-5 bg-yellow-700 rounded-xl font-bold">متوسط</button>
                <button onclick="startMemory('hard')" class="w-full p-5 bg-red-800 rounded-xl font-bold">صعب</button>
            </div>
            <div id="game-play" class="hidden flex-1 flex flex-col min-h-0 px-2">
                <div id="host-view" class="hidden flex flex-col h-full min-h-0">
                    <div id="host-top-bar" class="bg-slate-800 p-3 rounded-xl flex justify-between mb-2 text-base border border-slate-700 shrink-0">
                        <span id="answer-counter" class="text-teal-400 font-bold">somthing</span>
                        <span id="host-timer-text" class="text-red-500 font-black text-xl"></span>
                    </div>
                    <div id="host-game-container" class="bg-slate-card rounded-[2rem] p-4 flex-1 flex flex-col min-h-0 justify-center relative border-2 border-slate-700 shadow-inner">
                        <div id="memory-visuals" class="hidden text-center">
                            <div id="hand-wrapper" class="hand-container">
                                <div class="hand hand-left"></div>
                                <div class="number-reveal" id="target-number-display">0000</div>
                                <div class="hand hand-right"></div>
                            </div>
                            <h3 id="host-status-msg" class="font-bold text-lg text-teal-400 mt-2">...</h3>
                        </div>
                        <div id="standard-visuals" class="text-center">
                            <div id="player-spotlight" class="hidden text-orange-400 font-bold mb-2">الدور: <span id="current-player-name" class="bg-orange-600 text-white px-3 py-1 rounded text-2xl font-black">---</span></div>
                            <h2 id="display-title" class="font-black text-xl leading-tight">...</h2>
                            <div id="display-content" class="mt-4 text-slate-300 font-bold"></div>
                        </div>
                        <div id="hangman-visuals" class="hidden text-center w-full flex flex-col flex-1 min-h-0 items-stretch">
                            <div class="hangman-host-scroll w-full">
                                <p id="hangman-host-category" class="text-teal-400 font-black text-base mb-0.5"></p>
                                <p id="hangman-host-player" class="text-orange-400 font-bold text-sm mb-1"></p>
                                <img id="hangman-host-img" src="hangman/1220.png" alt="" class="mx-auto max-h-[min(20vh,9rem)] object-contain transition-opacity duration-500 rounded-lg bg-white/5 p-1"/>
                                <div id="hangman-host-slots" class="mt-1.5 text-base sm:text-xl font-black text-teal-300 flex flex-wrap justify-center gap-x-1.5 gap-y-1 px-1"></div>
                                <p id="hangman-host-pending" class="mt-1 text-slate-400 text-xs min-h-[1.25rem]"></p>
                                <div id="hangman-host-keyboard" class="mt-2 w-full max-w-md mx-auto grid grid-cols-7 gap-1 px-0.5"></div>
                                <div class="flex flex-wrap gap-1.5 justify-center mt-2 mb-1 w-full">
                                    <button type="button" onclick="hangmanHostSubmit()" class="px-4 py-2.5 bg-teal-600 rounded-xl font-black text-base">إرسال</button>
                                    <button type="button" onclick="hangmanHostBackspace()" class="px-4 py-2.5 bg-slate-600 rounded-xl font-black text-base">مسح</button>
                                    <button type="button" onclick="hangmanHostSkipTurn()" class="px-4 py-2.5 bg-amber-700 rounded-xl font-black text-base">تخطي الدور</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div id="dedicated-scoreboard" class="hidden flex-1 bg-slate-900 rounded-[2rem] p-6 border-2 border-amber-500 overflow-y-auto">
                        <h2 class="text-2xl font-black text-amber-400 text-center mb-6">ترتيب النقاط الحالي <i class="fa-solid fa-ranking-star"></i></h2>
                        <div id="dedicated-list" class="divide-y divide-slate-800"></div>
                    </div>
                    <div id="host-controls" class="py-3 shrink-0">
                        <div id="twister-scoring" class="hidden grid grid-cols-5 gap-1 mb-3">
                            <button onclick="awardManual(2)" class="p-3 bg-red-900 rounded-lg">2</button>
                            <button onclick="awardManual(4)" class="p-3 bg-orange-800 rounded-lg">4</button>
                            <button onclick="awardManual(6)" class="p-3 bg-yellow-700 rounded-lg">6</button>
                            <button onclick="awardManual(8)" class="p-3 bg-green-800 rounded-lg">8</button>
                            <button onclick="awardManual(10)" class="p-3 bg-green-500 rounded-lg font-bold">10</button>
                        </div>
                        <button id="action-btn" onclick="triggerNext()" class="w-full btn-purple p-5 rounded-[1.5rem] font-black text-2xl">التالي</button>
                        <div id="post-game-controls" class="hidden flex flex-col gap-2 mt-2">
                            <button onclick="restartSameCategory()" class="w-full p-4 btn-teal rounded-xl font-bold text-lg">جولة جديدة</button>
                            <button onclick="goToHostMainMenu()" class="w-full p-4 bg-slate-700 rounded-xl font-bold">القائمة</button>
                        </div>
                    </div>
                    <div id="leaderboard-ui" class="bg-slate-900/90 p-3 rounded-2xl border-2 border-teal-500 overflow-y-auto max-h-[15vh] mb-2 mt-2">
                        <div id="leaderboard-list" class="space-y-1 text-sm"></div>
                    </div>
                    <div id="tv-hangman-snapshot" class="hidden" aria-hidden="true"></div>
                </div>
                <div id="player-view" class="hidden flex flex-col h-full">
                    <div class="bg-slate-800 p-3 rounded-xl flex justify-between items-center mb-2 text-sm border border-slate-700">
                        <div class="flex items-center gap-2">
                            <span id="p-status" class="text-teal-400 font-black italic">جاهز؟</span>
                            <span id="progress-indicator" class="progress-badge hidden"></span>
                        </div>
                        <div class="flex items-center gap-3">
                            <span id="player-timer" class="timer-display hidden"></span>
                            <span id="p-score" class="font-black text-yellow-400 text-lg">0</span>
                        </div>
                    </div>
                    <div class="flex-1 flex flex-col justify-center">
                        <div id="player-quiz-ui" class="w-full space-y-3">
                            <div id="player-q-text" class="text-center font-black text-xl mb-4 px-2">...</div>
                            <div id="player-input-area" class="px-2 space-y-3 scroll-container max-h-[40vh]"></div>
                        </div>
                        <div id="player-hangman-ui" class="hidden w-full flex flex-col items-center px-2">
                            <p id="player-hangman-category" class="text-teal-400 font-black text-center text-lg mb-1"></p>
                            <p id="player-hangman-msg" class="text-center text-slate-300 font-bold mb-2"></p>
                            <img id="player-hangman-img" src="" alt="" class="mx-auto max-h-[24vh] object-contain rounded-xl bg-white/5 p-2 mb-2"/>
                            <div id="player-hangman-slots" class="text-lg font-black text-teal-300 flex flex-wrap justify-center gap-x-2 gap-y-2"></div>
                        </div>
                        <div id="player-memory-ui" class="hidden w-full flex flex-col items-center">
                            <div id="digit-boxes">
                                <div class="digit-box" data-idx="0">-</div>
                                <div class="digit-box" data-idx="1">-</div>
                                <div class="digit-box" data-idx="2">-</div>
                                <div class="digit-box" data-idx="3">-</div>
                            </div>
                        </div>
                    </div>
                    <div id="keypad-container" class="hidden pb-2 shrink-0">
                        <div class="keypad-grid">
                            <button class="key-btn" onclick="pressKey('1')">1</button>
                            <button class="key-btn" onclick="pressKey('2')">2</button>
                            <button class="key-btn" onclick="pressKey('3')">3</button>
                            <button class="key-btn" onclick="pressKey('4')">4</button>
                            <button class="key-btn" onclick="pressKey('5')">5</button>
                            <button class="key-btn" onclick="pressKey('6')">6</button>
                            <button class="key-btn" onclick="pressKey('7')">7</button>
                            <button class="key-btn" onclick="pressKey('8')">8</button>
                            <button class="key-btn" onclick="pressKey('9')">9</button>
                            <button class="key-btn text-red-500" onclick="pressKey('back')"><i class="fa-solid fa-delete-left"></i></button>
                            <button class="key-btn" onclick="pressKey('0')">0</button>
                            <button class="key-btn submit !bg-teal-600" id="mem-submit" onclick="submitMemory()">إرسال</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { gameData } from './questions.js';
        import { hangmanCategories } from './hangman-data.js';
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove, get, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBGwNKIykgrmewdwUZyA93DQ-LHI3rLOyw",
            authDomain: "family-games-app.firebaseapp.com",
            databaseURL: "https://family-games-app-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "family-games-app",
            storageBucket: "family-games-app.firebasestorage.app",
            messagingSenderId: "290150126558",
            appId: "1:290150126558:web:bf5a38cc8d104462d9c34f"
        };
        const fbApp = initializeApp(firebaseConfig);
        const db = getDatabase(fbApp);
        const liveRef = ref(db, 'live_game');
        const scoresRef = ref(db, 'scores');
        const answersRef = ref(db, 'current_answers');
        const mirrorRef = ref(db, 'tv_mirror');
        const sessionRef = ref(db, 'session');

        let myRole = '', myName = '', currentSection = '', currentType = '';
        let currentQuestions = [], currentIndex = -1, lastGameConfig = {};
        let playersList = [], timerInterval = null, memoryInput = "", roundStartTime = 0;
        let gameActive = false;
        let playerTimerInterval = null;
        let qrGenerated = false;
        let hasSubmittedMemory = false;
        let currentTargetNumber = '';
        let lastTvSyncAt = 0; // Prevent double mirror updates (MutationObserver + manual sync).
        let twisterPhase = 'question'; // question -> scoring -> question
        let twisterTotalRounds = 7;
        let twisterPlayerOrder = [];
        /** Last phrase each player received in a completed tongue-twister game (avoid repeats next game). */
        let twisterLastPhraseByPlayer = {};
        let quizFeedbackTimeout = null;
        let activeBrainRound = 0;
        let hangmanSessionRound = 1;
        let hangmanPlayerOrder = [];
        let hangmanTurnIndex = -1;
        let hangmanWordsUsed = new Set();
        let hangmanWordsRound1 = new Set();
        let hangmanCategory = '';
        let hangmanWord = '';
        let hangmanWordChars = [];
        let hangmanRevealed = [];
        let hangmanWrongCount = 0;
        let hangmanGuessedNorm = new Set();
        let hangmanPendingChar = '';
        let hangmanPhase = 'idle';

        window.setRole = async (role) => {
            myRole = role;
            const errorDiv = document.getElementById('name-error');
            const inputField = document.getElementById('player-name-input');
            
            if (role === 'player') {
                myName = inputField.value.trim();

                    errorDiv.classList.remove('hidden');
                    inputField.classList.add('border-red-500', 'shake');

                    return;
                }
                const snapshot = await get(scoresRef);

                if (scores[myName] !== undefined) {
                    errorDiv.textContent = "هذا الاسم مستخدم بالفعل، اختر اسما آخر";

                    inputField.classList.add('border-red-500', 'shake');
                    setTimeout(() => inputField.classList.remove('shake'), 500);
                    return;
                }
                errorDiv.classList.add('hidden');
                inputField.classList.remove('border-red-500');

                playerJoinedSessionEpoch = sessionSnap.val()?.epoch ?? 0;

                    if (myRole === 'player' && playerJoinedSessionEpoch !== null && e !== playerJoinedSessionEpoch) {

        window.backToGameMenu = () => {
            if (myRole !== 'host') return;
            gameActive = false;
            dismissQR();

            const sec = document.getElementById('section-select');
            const typ = document.getElementById('type-select');
            const mem = document.getElementById('memory-difficulty');
            const gp = document.getElementById('game-play');
            const dedicated = document.getElementById('dedicated-scoreboard');
            const hostContainer = document.getElementById('host-game-container');

            const gamePlayVisible = !gp.classList.contains('hidden');
            const scoreboardOnly = gamePlayVisible && !dedicated.classList.contains('hidden') && hostContainer.classList.contains('hidden');
            const inActiveGame = gamePlayVisible && !hostContainer.classList.contains('hidden');
            const atMainSectionMenu =
                gp.classList.contains('hidden') &&
                typ.classList.contains('hidden') &&
                mem.classList.contains('hidden') &&
                !sec.classList.contains('hidden');

            if (atMainSectionMenu) {
                hostExitSessionFully();
                return;
            }

            if (scoreboardOnly) {
                remove(liveRef);
                remove(answersRef);
                gp.classList.add('hidden');
                hostContainer.classList.remove('hidden');
                dedicated.classList.add('hidden');
                document.getElementById('host-top-bar').classList.remove('hidden');
                document.getElementById('leaderboard-ui').classList.remove('hidden');
                sec.classList.remove('hidden');
                document.getElementById('host-back-btn').classList.remove('hidden');

                syncTV();
                return;
            }

            if (inActiveGame) {
                remove(liveRef);
                remove(answersRef);
                document.getElementById('hangman-visuals').classList.add('hidden');
                document.getElementById('standard-visuals').classList.remove('hidden');
                document.getElementById('host-game-container').classList.remove('host-game--hangman');
                document.getElementById('host-controls').classList.remove('hangman-host-controls');
                document.getElementById('leaderboard-ui').classList.remove('hangman-host-leaderboard');
                gp.classList.add('hidden');
                document.getElementById('host-view').classList.add('hidden');
                if (hostBackFromGameTarget === 'memory') {
                    mem.classList.remove('hidden');
                    typ.classList.add('hidden');
                } else {
                    typ.classList.remove('hidden');
                    mem.classList.add('hidden');
                }
                document.getElementById('host-back-btn').classList.remove('hidden');
                set(mirrorRef, { showWelcome: true, ts: Date.now(), qrVisible: false });

                return;

                mem.classList.add('hidden');
                typ.classList.remove('hidden');
                document.getElementById('host-back-btn').classList.remove('hidden');
                return;
            }

                typ.classList.add('hidden');
                sec.classList.remove('hidden');
                document.getElementById('host-back-btn').classList.remove('hidden');
                return;
            }

                 <button onclick="setupQuestions('islamic')" class="w-full p-5 bg-indigo-700 rounded-2xl font-black mb-3 text-lg">إسلاميات <i class="fa-solid fa-kaaba"></i></button>

        function getRandomSet(arr, size) {
            let shuffled = [...arr].sort(() => 0.5 - Math.random());
            return shuffled.slice(0, size);
        }

        function shuffleArray(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        const HANGMAN_KEYS = ['ا', 'ب', 'ت', 'ث', 'ج', 'ح', 'خ', 'د', 'ذ', 'ر', 'ز', 'س', 'ش', 'ص', 'ض', 'ط', 'ظ', 'ع', 'غ', 'ف', 'ق', 'ك', 'ل', 'م', 'ن', 'ه', 'و', 'ي', 'ة'];

        function normalizeHangmanLetter(ch) {
            if (!ch) return '';
            const x = ch.trim();
            if (/[أإآ]/.test(x)) return 'ا';
            if (x === 'ى') return 'ا';
            return x;
        }

        function hangmanAllEntries() {
            return hangmanCategories.flatMap((c) => c.words.map((w) => ({ category: c.name, word: w })));
        }

        function hangmanPickRandomWord() {
            const pool = hangmanAllEntries().filter((e) => !hangmanWordsUsed.has(e.word));
            if (!pool.length) return null;
            return pool[Math.floor(Math.random() * pool.length)];
        }

        function hangmanBuildOrder() {
            const n = playersList.length;
            if (!n) return ['المتطوع'];
            const start = Math.floor(Math.random() * n);
            return Array.from({ length: n }, (_, i) => playersList[(start + i) % n]);
        }

        function hangmanWordFullyRevealed() {
            return hangmanWordChars.every((ch, i) => hangmanRevealed[i]);
        }

        function hangmanMaskedHtml() {
            const parts = [];
            hangmanWordChars.forEach((ch, i) => {
                if (ch === ' ' || ch === '\u00a0') {
                    parts.push('<span class="inline-block w-6"></span>');
                } else if (hangmanRevealed[i]) {
                    parts.push(`<span class="inline-block min-w-[1.2em] text-center border-b-2 border-teal-500 mx-0.5">${ch}</span>`);
                } else {
                    parts.push('<span class="inline-block min-w-[1.2em] text-center border-b-2 border-slate-500 mx-0.5">□</span>');
                }
            });
            return parts.join('');
        }

        function hangmanComputeImageSrc() {
            if (hangmanTurnOutcome === 'skip' && hangmanPhase === 'turn_done') return '';
            if (hangmanPhase === 'turn_done' && hangmanTurnOutcome === 'win') return 'hangman/1229.png';
            if (hangmanPhase === 'turn_done' && hangmanTurnOutcome === 'lose') return 'hangman/1227.png';
            const w = Math.min(hangmanWrongCount, 7);
            return `hangman/${1220 + w}.png`;
        }

        function escapeHtml(str) {
            if (str == null) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function updateHangmanTvSnapshot() {
            const el = document.getElementById('tv-hangman-snapshot');
            if (!el) return;
            const cat = hangmanCategory || '';
            const player = hangmanPlayerOrder[hangmanTurnIndex] || '';
            const imgSrc = hangmanComputeImageSrc();
            const slots = hangmanMaskedHtml();
            let feedbackHtml = '';
            if (hangmanPhase === 'feedback' && hangmanTvFeedback) {
                const { ok, letter } = hangmanTvFeedback;
                feedbackHtml = ok
                    ? `<div class="feedback-correct text-center p-4 rounded-2xl mb-3 w-full max-w-lg mx-auto"><div class="text-5xl mb-1">✓</div><div class="text-2xl font-black text-white">صحيح: ${escapeHtml(letter)}</div></div>`
                    : `<div class="feedback-wrong text-center p-4 rounded-2xl mb-3 w-full max-w-lg mx-auto"><div class="text-5xl mb-1">✗</div><div class="text-2xl font-black text-white">خطأ: ${escapeHtml(letter)}</div></div>`;
            }
            let subline = player ? `اللاعب: ${escapeHtml(player)}` : '';
            if (hangmanPhase === 'intro' || hangmanTurnIndex < 0) {
                subline = 'استعدوا...';
            }
            const imgBlock = imgSrc
                ? `<img src="${escapeHtml(imgSrc)}" alt="" class="mx-auto max-h-[38vh] object-contain rounded-xl bg-white/5 p-2 mb-2"/>`
                : '';
            el.innerHTML = `
                <div class="w-full flex flex-col items-center text-center px-2">
                    <p class="text-teal-400 font-black text-[clamp(1rem,3.5vh,2rem)] mb-1">${escapeHtml(cat)}</p>
                    <p class="text-orange-400 font-bold mb-2 text-[clamp(0.9rem,3vh,1.5rem)]">${subline}</p>
                    ${feedbackHtml}
                    ${imgBlock}
                    <div class="text-[clamp(1rem,3.2vh,2.2rem)] font-black text-teal-300 flex flex-wrap justify-center gap-x-2 gap-y-2">${slots}</div>
                </div>
            `;
        }

        async function hangmanSetLive(extra = {}) {
            const player = hangmanPlayerOrder[hangmanTurnIndex] || '';
            const payload = {
                type: 'hangman',
                status: hangmanPhase === 'feedback' ? 'feedback' : 'playing',
                category: hangmanCategory,
                activePlayer: player,
                wrongCount: hangmanWrongCount,
                imageSrc: hangmanComputeImageSrc(),
                slotsHtml: hangmanMaskedHtml(),
                phase: hangmanPhase,
                turnOutcome: hangmanTurnOutcome,
                turnIndex: hangmanTurnIndex < 0 ? 0 : hangmanTurnIndex + 1,
                totalTurns: hangmanPlayerOrder.length,
                sessionRound: hangmanSessionRound,
                ...extra
            };
            await set(liveRef, { ...payload, ts: Date.now() });
        }

        function hangmanInitHostKeyboard() {
            const wrap = document.getElementById('hangman-host-keyboard');
            if (hangmanKeyboardBuilt) {
                hangmanRefreshKeyboardStyles();
                return;
            }
            wrap.innerHTML = HANGMAN_KEYS.map((k) =>
                `<button type="button" data-hk="${k}" onclick="hangmanHostPick('${k}')" class="hangman-key py-1.5 px-1 rounded-md bg-slate-700 font-black text-sm border border-slate-600 hover:bg-slate-600">${k}</button>`
            ).join('');
            hangmanKeyboardBuilt = true;
        }

        function hangmanRefreshKeyboardStyles() {
            document.querySelectorAll('.hangman-key').forEach((btn) => {
                const k = btn.getAttribute('data-hk');
                const norm = normalizeHangmanLetter(k);
                const used = hangmanGuessedNorm.has(norm);
                btn.classList.toggle('opacity-30', used);
                btn.classList.toggle('pointer-events-none', used);
            });
        }

        window.hangmanHostPick = (letter) => {
            if (hangmanPhase !== 'playing') return;
            hangmanPendingChar = letter;
            document.getElementById('hangman-host-pending').innerText = hangmanPendingChar
                ? `الحرف المختار: ${hangmanPendingChar}`
                : '';
        };

        window.hangmanHostBackspace = () => {
            if (hangmanPhase !== 'playing') return;
            hangmanPendingChar = '';
            document.getElementById('hangman-host-pending').innerText = '';
        };

        window.hangmanHostSubmit = async () => {
            if (hangmanPhase !== 'playing' || !hangmanPendingChar) return;
            const raw = hangmanPendingChar[0];
            const norm = normalizeHangmanLetter(raw);
            if (hangmanGuessedNorm.has(norm)) {
                alert('تم استخدام هذا الحرف مسبقاً');
                return;
            }
            hangmanGuessedNorm.add(norm);
            hangmanPendingChar = '';
            document.getElementById('hangman-host-pending').innerText = '';

            let correct = false;
            for (let i = 0; i < hangmanWordChars.length; i++) {
                const ch = hangmanWordChars[i];
                if (ch === ' ' || ch === '\u00a0') continue;
                if (normalizeHangmanLetter(ch) === norm) {
                    hangmanRevealed[i] = true;
                    correct = true;
                }
            }

            hangmanPhase = 'feedback';
            hangmanTvFeedback = { ok: correct, letter: raw };
            document.getElementById('action-btn').classList.add('opacity-40', 'pointer-events-none');
            await hangmanSetLive({ feedbackLetter: raw, feedbackOk: correct });
            updateHangmanTvSnapshot();
            syncTV();

            await hangmanShowFeedbackModal(correct, raw);
            hangmanTvFeedback = null;

            if (!correct) {
                hangmanWrongCount = Math.min(7, hangmanWrongCount + 1);
            }

            document.getElementById('hangman-host-slots').innerHTML = hangmanMaskedHtml();
            hangmanRefreshKeyboardStyles();

            if (hangmanWordFullyRevealed()) {
                hangmanTurnOutcome = 'win';
                hangmanPhase = 'turn_done';
                const wimg = document.getElementById('hangman-host-img');
                wimg.classList.remove('hidden');
                wimg.src = 'hangman/1229.png';
                document.getElementById('answer-counter').innerText = 'فوز! اضغط التالي';
            } else if (hangmanWrongCount >= 7) {
                hangmanTurnOutcome = 'lose';
                hangmanPhase = 'turn_done';
                const wimg = document.getElementById('hangman-host-img');
                wimg.classList.remove('hidden');
                wimg.src = 'hangman/1227.png';
                document.getElementById('answer-counter').innerText = 'خسرت! اضغط التالي';
            } else {
                hangmanPhase = 'playing';
                const img = document.getElementById('hangman-host-img');
                img.classList.remove('hidden');
                img.classList.add('opacity-0');
                setTimeout(() => {
                    img.src = hangmanComputeImageSrc();
                    img.classList.remove('opacity-0');
                }, 200);
            }

            document.getElementById('action-btn').classList.remove('opacity-40', 'pointer-events-none');
            await hangmanSetLive();
            syncTV();
        };

        function hangmanShowFeedbackModal(ok, letter) {
            return new Promise((resolve) => {
                const modal = document.getElementById('hangman-feedback-modal');
                const inner = document.getElementById('hangman-feedback-inner');
                document.getElementById('hangman-feedback-icon').innerHTML = ok
                    ? '<span class="text-green-400">✓</span>'
                    : '<span class="text-red-400">✗</span>';
                document.getElementById('hangman-feedback-text').innerText = ok
                    ? `صحيح: ${letter}`
                    : `خطأ: ${letter}`;
                inner.classList.remove('opacity-100');
                inner.classList.add('opacity-0');
                modal.classList.remove('hidden');
                requestAnimationFrame(() => {
                    inner.classList.remove('opacity-0');
                    inner.classList.add('opacity-100');
                });
                setTimeout(() => {
                    inner.classList.remove('opacity-100');
                    inner.classList.add('opacity-0');
                    setTimeout(() => {
                        modal.classList.add('hidden');
                        resolve();
                    }, 280);
                }, 1100);
            });
        }

        async function hangmanAddScore(name, delta) {
            const r = await get(ref(db, `scores/${name}`));
            await set(ref(db, `scores/${name}`), (r.val() || 0) + delta);
            updateLeaderboardUI((await get(scoresRef)).val() || {});
        }

        async function hangmanSkipCurrentPlayer() {
            hangmanTurnOutcome = 'skip';
            hangmanPhase = 'turn_done';
            document.getElementById('hangman-host-img').classList.add('hidden');
            document.getElementById('answer-counter').innerText = 'تم التخطي — اضغط التالي';
            await hangmanSetLive();
            syncTV();
        }

        window.hangmanHostSkipTurn = () => {
            if (hangmanPhase !== 'playing') return;
            if (!confirm('هل أنت متأكد من تخطي دور هذا اللاعب؟ سيتم احتساب صفر نقطة.')) return;
            hangmanSkipCurrentPlayer();
        };

        async function hangmanStartTurn(index) {
            const picked = hangmanPickRandomWord();
            if (!picked) {
                alert('لا توجد كلمات متبقية في البنك');
                return;
            }
            hangmanWordsUsed.add(picked.word);

        /**
         * Tongue twister: one turn per player; random starting player then order cycles.
         * Phrases are unique within the game when the bank has enough lines; otherwise random with repeats.
         * Tries to avoid giving a player the same phrase as in the previous completed twister game.
         */
        function buildTwisterGame(players, phraseBank, lastPhraseByPlayer) {
            const pool = phraseBank.slice();
            const prev = lastPhraseByPlayer || {};
            let order = [];
            if (!players.length) {
                order = ['المتطوع'];
            } else {
                const start = Math.floor(Math.random() * players.length);
                for (let i = 0; i < players.length; i++) {
                    order.push(players[(start + i) % players.length]);
                }
            }
            const n = order.length;
            const phrases = [];

            if (n <= pool.length) {
                const bank = pool.slice();
                let chosenPhrases = null;
                for (let attempt = 0; attempt < 120; attempt++) {
                    const perm = shuffleArray(bank);
                    const slice = perm.slice(0, n);
                    if (new Set(slice).size !== n) continue;
                    let ok = true;
                    for (let i = 0; i < n; i++) {
                        if (slice[i] === prev[order[i]]) { ok = false; break; }
                    }
                    if (ok) { chosenPhrases = slice; break; }
                }
                if (!chosenPhrases) {
                    const remaining = shuffleArray(bank.slice());
                    chosenPhrases = [];
                    for (const player of order) {
                        const avoid = prev[player];
                        let idx = remaining.findIndex((p) => p !== avoid);
                        if (idx === -1) idx = remaining.findIndex(() => true);
                        const [chosen] = remaining.splice(idx, 1);
                        chosenPhrases.push(chosen);
                    }
                }
                phrases.push(...chosenPhrases);
            } else {
                const bag = shuffleArray(pool);
                const usedThisRound = new Set();
                for (const player of order) {
                    const avoid = prev[player];
                    let candidates = bag.filter((p) => p !== avoid && !usedThisRound.has(p));
                    if (candidates.length === 0) candidates = bag.filter((p) => p !== avoid);
                    if (candidates.length === 0) candidates = bag.slice();
                    const choice = candidates[Math.floor(Math.random() * candidates.length)];
                    usedThisRound.add(choice);
                    phrases.push(choice);
                }
            }

            const phraseByPlayer = {};
            order.forEach((name, i) => { phraseByPlayer[name] = phrases[i]; });
            return { order, phrases, phraseByPlayer };
        }

                    document.getElementById('player-q-text').innerText = isWin ? "أنت البطل!" : "حظا أوفر";
                    document.getElementById('player-input-area').innerHTML = `<div class='text-center'><div class='text-yellow-400 text-3xl font-black mb-2'>الفائز: ${data.winner}</div></div>`;
                    document.getElementById('progress-indicator').classList.add('hidden');
                    document.getElementById('player-timer').classList.add('hidden');
                    if(isWin) confetti();
                    return;
                }
                
                if(data.status === 'scoring') {
                    if(playerTimerInterval) {
                        clearInterval(playerTimerInterval);
                        playerTimerInterval = null;
                    }
                    document.getElementById('player-timer').classList.add('hidden');
                }
                
                if(data.type === 'memory') {
                    document.getElementById('keypad-container').classList.remove('hidden');
                    document.getElementById('player-memory-ui').classList.remove('hidden');
                    document.getElementById('player-quiz-ui').classList.add('hidden');
                    document.getElementById('player-hangman-ui').classList.add('hidden');
                    handlePlayerMemory(data);
                } else if (data.type === 'hangman') {
                    document.getElementById('keypad-container').classList.add('hidden');
                    document.getElementById('player-memory-ui').classList.add('hidden');
                    document.getElementById('player-quiz-ui').classList.add('hidden');
                    document.getElementById('player-hangman-ui').classList.remove('hidden');
                    handlePlayerHangman(data);
                } else {
                    document.getElementById('keypad-container').classList.add('hidden');
                    document.getElementById('player-memory-ui').classList.add('hidden');
                    document.getElementById('player-hangman-ui').classList.add('hidden');
                    document.getElementById('player-quiz-ui').classList.remove('hidden');
                    handlePlayerStandard(data);
                }
            });
        }

        function handlePlayerHangman(data) {
            if (data.status === 'finished') {
                document.getElementById('p-status').innerText = 'انتهت اللعبة';
                return;
            }
            document.getElementById('player-hangman-category').innerText = data.category || '';
            const player = data.activePlayer || '';
            const isMe = myName === player;
            let msg = '';
            if (data.phase === 'turn_done') {
                if (data.turnOutcome === 'win' && isMe) {
                    msg = 'مبروك! لقد فزت بالجولة!';
                } else if (data.turnOutcome === 'lose' && isMe) {
                    msg = 'للأسف، انتهت المحاولات في هذه الجولة.';
                } else if (data.turnOutcome === 'skip' && isMe) {
                    msg = 'تم تخطي دورك.';
                } else if (data.turnOutcome === 'win' && !isMe) {
                    msg = `فاز ${player}!`;
                } else if (data.turnOutcome === 'lose' && !isMe) {
                    msg = `${player} لم يكمل الكلمة.`;
                } else if (data.turnOutcome === 'skip' && !isMe) {
                    msg = `تم تخطي دور ${player}.`;
                } else {
                    msg = 'انتظر دورك.';
                }
            } else if (data.status === 'feedback' && data.feedbackLetter != null) {
                msg = isMe
                    ? (data.feedbackOk ? `صحيح! (${data.feedbackLetter})` : `ليس في الكلمة (${data.feedbackLetter})`)
                    : 'المضيف يتحقق من الحرف...';
            } else {
                msg = isMe ? 'دورك! نادِ حرفاً للمضيف لإدخاله.' : 'استمع للمتحدث';
            }
            document.getElementById('player-hangman-msg').innerText = msg;
            const img = document.getElementById('player-hangman-img');
            if (data.imageSrc) {
                img.src = data.imageSrc;
                img.classList.remove('hidden');
            } else {
                img.classList.add('hidden');
            }
            document.getElementById('player-hangman-slots').innerHTML = data.slotsHtml || '';
            if (data.turnIndex && data.totalTurns) {
                document.getElementById('progress-indicator').textContent = `الدور ${data.turnIndex} من ${data.totalTurns}`;
                document.getElementById('progress-indicator').classList.remove('hidden');
            }
        }

        function handlePlayerMemory(data) {
            // Keep player-side target in sync so result modal compares against real number.
            if (data.target) currentTargetNumber = data.target;
            const kbtns = document.querySelectorAll('.key-btn');
            if(data.status === 'input') {
                hasSubmittedMemory = false;
                document.getElementById('p-status').innerText = "أدخل الرقم!";
                kbtns.forEach(b => b.classList.remove('disabled'));
                if(!roundStartTime) roundStartTime = Date.now();
            } else {
                document.getElementById('p-status').innerText = (data.status === 'scoring') ? "انتهى" : "راقب...";
                kbtns.forEach(b => b.classList.add('disabled'));
                if(data.status === 'countdown') { 
                    resetMemoryUI(); 
                    roundStartTime = 0; 
                    memoryInput = "";
                    hasSubmittedMemory = false;
                    document.getElementById('p-status').innerText = "استعد...";
                }
            }
        }

        window.pressKey = (key) => {
            if(hasSubmittedMemory) return;
            if(key === 'back') memoryInput = memoryInput.slice(0, -1);
            else if(memoryInput.length < 4) memoryInput += key;
            const boxes = document.querySelectorAll('.digit-box');
            boxes.forEach((box, i) => box.innerText = memoryInput[i] || "-");
            document.getElementById('mem-submit').classList.toggle('disabled', memoryInput.length < 4);
        };

        function autoSubmitMemory() {
            if(hasSubmittedMemory) return;
            
            set(ref(db, `current_answers/${myName}`), { 
                val: memoryInput.padEnd(4, '-'),
                time: Date.now() - roundStartTime,
                auto: true
            });
            hasSubmittedMemory = true;
            document.querySelectorAll('.key-btn').forEach(b => b.classList.add('disabled'));
            document.getElementById('p-status').innerText = "انتهى الوقت - تم الإرسال تلقائياً";
            
            setTimeout(() => {
                showPlayerMemoryResult();
            }, 2000);
        }

        window.submitMemory = () => {
            if(hasSubmittedMemory) return;
            if(playerTimerInterval) {
                clearInterval(playerTimerInterval);
                playerTimerInterval = null;
            }
            document.getElementById('player-timer').classList.add('hidden');
            
            hasSubmittedMemory = true;
            set(ref(db, `current_answers/${myName}`), { 
                val: memoryInput, 
                time: Date.now() - roundStartTime 
            });
            document.querySelectorAll('.key-btn').forEach(b => b.classList.add('disabled'));
            document.getElementById('p-status').innerText = "تم ✓";
            
            showPlayerMemoryResult();
        };

        function showPlayerMemoryResult() {
            const modal = document.getElementById('player-result-modal');
            const correctContainer = document.getElementById('result-correct-number');
            const playerContainer = document.getElementById('result-player-number');
            const pointsDiv = document.getElementById('result-points');
            
            correctContainer.innerHTML = '';
            playerContainer.innerHTML = '';
            
            const target = currentTargetNumber || '0000';
            let score = 0;
            
            for(let i=0; i<4; i++) {
                const div = document.createElement('div');
                div.className = 'result-digit-box result-correct';
                div.textContent = target[i];
                correctContainer.appendChild(div);
            }
            
            const playerAnswer = memoryInput.padEnd(4, '-');
            for(let i=0; i<4; i++) {
                const div = document.createElement('div');
                const isCorrect = playerAnswer[i] === target[i];
                div.className = `result-digit-box ${isCorrect ? 'result-correct' : 'result-wrong'}`;
                div.textContent = playerAnswer[i];
                playerContainer.appendChild(div);
                if(isCorrect) score += 2;
            }
            if(score === 8) score = 10;
            
            pointsDiv.textContent = `+${score} نقطة`;
            pointsDiv.className = 'text-3xl font-black text-yellow-400 mb-4';
            
            modal.classList.remove('hidden');
        }

        window.closePlayerResult = () => {
            document.getElementById('player-result-modal').classList.add('hidden');
        };

        function resetMemoryUI() {
            memoryInput = ""; 
            document.querySelectorAll('.digit-box').forEach(b => { b.innerText = "-"; });
            document.getElementById('mem-submit').classList.add('disabled');
        }

        function handlePlayerStandard(data) {
            if(data.status === 'scoring') {
                if (quizFeedbackTimeout) {
                    clearTimeout(quizFeedbackTimeout);
                    quizFeedbackTimeout = null;
                }
                document.getElementById('p-status').innerText = "النتيجة...";
                document.getElementById('player-input-area').innerHTML = ""; return;
            }
            if(data.type === 'brain') {
                if (quizFeedbackTimeout) {
                    clearTimeout(quizFeedbackTimeout);
                    quizFeedbackTimeout = null;
                }
                activeBrainRound = data.round || 0;
                document.getElementById('p-status').innerText = "أجب الآن!";
                document.getElementById('player-q-text').innerText = data.content.q;
                const options = data.content.options;
                const correctIdx = data.content.correct;
                const correctText = options[correctIdx];
                document.getElementById('player-input-area').innerHTML = options.map((o, i) => 
                    `<button onclick="submitQuiz(${i}, ${correctIdx}, ${data.startTime}, '${correctText.replace(/'/g, "\\'")}')" class="p-5 bg-slate-700 rounded-xl font-black block w-full text-lg hover:bg-slate-600 transition-colors">${o}</button>`
                ).join('');
            } else {
                document.getElementById('p-status').innerText = (data.activePlayer === myName) ? "دورك!" : "استمع للمتحدث";
                document.getElementById('player-q-text').innerText = (data.activePlayer === myName) ? data.content : "---";
                document.getElementById('player-input-area').innerHTML = (data.activePlayer === myName)
                    ? `<p class="text-center text-sm text-slate-400 leading-snug px-3 mt-1">كرر العبارة خمس مرات متتالية بسرعة وبنطق واضح.</p>`
                    : "";
            }
        }

        window.submitQuiz = (idx, correct, start, correctText) => {
            const submittedRound = activeBrainRound;
            if(playerTimerInterval) {
                clearInterval(playerTimerInterval);
                playerTimerInterval = null;
            }
            
            set(ref(db, `current_answers/${myName}`), true);
            const inputArea = document.getElementById('player-input-area');
            const isCorrect = idx === correct;
            
            const timerEl = document.getElementById('player-timer');
            if(timerEl) {
                timerEl.classList.add('hidden');
                timerEl.classList.remove('urgent');
            }
            
            if(isCorrect) {
                const pts = 10 + Math.max(0, 10 - (Date.now() - start)/1000);
                get(ref(db, `scores/${myName}`)).then(s => set(ref(db, `scores/${myName}`), (s.val() || 0) + pts));
                inputArea.innerHTML = `
                    <div class="feedback-correct text-center p-6 rounded-2xl mb-4 animate-[bounce_0.5s_ease-out]">
                        <div class="text-5xl mb-2">✓</div>
                        <div class="text-2xl font-black text-white mb-2">إجابة صحيحة!</div>
                        <div class="text-xl text-green-100">+${Math.round(pts)} نقطة</div>
                    </div>
                `;
                if(navigator.vibrate) navigator.vibrate([50, 100, 50]);
            } else {
                inputArea.innerHTML = `
                    <div class="feedback-wrong text-center p-6 rounded-2xl mb-4">
                        <div class="text-5xl mb-2">✗</div>
                        <div class="text-2xl font-black text-white mb-2">إجابة خاطئة</div>
                        <div class="text-lg text-red-100">الإجابة الصحيحة: <span class="font-bold text-white">${correctText}</span></div>
                    </div>
                `;
                if(navigator.vibrate) navigator.vibrate(200);
            }
            if (quizFeedbackTimeout) clearTimeout(quizFeedbackTimeout);
            quizFeedbackTimeout = setTimeout(() => {
                // If a newer round is already active, don't overwrite its options UI.
                if (activeBrainRound !== submittedRound) return;
                inputArea.innerHTML = "<div class='text-center text-slate-400 text-xl font-bold mt-5 p-4'>انتظر السؤال التالي...</div>";
                quizFeedbackTimeout = null;
            }, 2000);
        };

        window.restartSameCategory = async () => {
            await remove(answersRef);
            currentIndex = -1;
            hasSubmittedMemory = false;
            memoryInput = "";
            resetMemoryUI();
            
            if(lastGameConfig.type === 'memory') startMemory(lastGameConfig.diff);
            else if(lastGameConfig.type === 'brain') setupQuestions(lastGameConfig.pool);
            else if(lastGameConfig.type === 'hangman') setupHangman();
            else setupTwisters();
        };

        window.awardManual = (pts) => {
            const name = document.getElementById('current-player-name').innerText;
            get(ref(db, `scores/${name}`)).then(s => set(ref(db, `scores/${name}`), (s.val() || 0) + pts));
            document.getElementById('twister-scoring').classList.add('hidden');
        };
        
        function syncTV() {
            if (myRole !== 'host') return;
            const now = Date.now();
            if (now - lastTvSyncAt < 150) return;
            lastTvSyncAt = now;
            const container = document.getElementById('host-game-container');
            const scoreboard = document.getElementById('dedicated-scoreboard');
            const topBar = document.getElementById('host-top-bar');
            const timerText = document.getElementById('host-timer-text').innerText;
            // If the host view is visible, ensure the TV shows the actual game (not the welcome screen).
            // This fixes cases where `showWelcome` might have been set to true and never cleared.
            const hostViewHidden = document.getElementById('host-view')?.classList.contains('hidden');
            const hmVis = document.getElementById('hangman-visuals');
            const useHangmanTv =
                currentType === 'hangman' && hmVis && !hmVis.classList.contains('hidden');
            let mainHTMLForTv = container.innerHTML;
            if (useHangmanTv) {
                updateHangmanTvSnapshot();
                mainHTMLForTv = document.getElementById('tv-hangman-snapshot').innerHTML;
            }
            
            update(mirrorRef, {
                showWelcome: hostViewHidden ? true : false,
                mainHTML: mainHTMLForTv,
                mainClasses: container.className,
                scoreHTML: scoreboard.innerHTML,
                scoreVisible: !scoreboard.classList.contains('hidden'),
                topBarHTML: topBar.innerHTML,
                timerText: timerText, // Send raw text (numbers only or "انتهى" or empty)
                counterText: document.getElementById('answer-counter').innerText,
                ts: Date.now()
            });
        }

        const observer = new MutationObserver(syncTV);
        observer.observe(document.getElementById('host-view'), { childList: true, subtree: true, attributes: true });
    </script>
</body>
</html>
